generated: '2026-09-18'
method: searched
source: https://docs.usebruno.com/llms.txt and the linked documentation pages
provider: Bruno
providerId: bruno-api
description: >-
  Bruno publishes no HTTP API of its own, so this is not a conformance claim about a served
  contract. It records the specifications the Bruno CLIENT implements - the formats it reads
  and writes and the authentication schemes it speaks - each with the documentation page that
  states it, plus the one published compliance certification. Absence of a claim here means we
  found no documentation asserting it, not that it is unsupported.
subject: client-implementation
conformance:
- id: opencollection
  name: OpenCollection
  conforms: true
  evidence: https://docs.usebruno.com/opencollection-yaml/overview
  note: >-
    Bruno's open, YAML-based collection format, specified at https://www.opencollection.com and
    now the recommended format for new collections; a structure reference and samples are
    published alongside it. This is the domain standard Bruno declares for its own market
    (API collection interchange) - it authors the specification rather than merely consuming one.
  domain_standard: true
- id: bru-lang
  name: Bru markup language (.bru)
  conforms: true
  evidence: https://docs.usebruno.com/bru-lang/overview
  note: Bruno's original plain-text collection format; a documented migration path to OpenCollection YAML exists.
- id: openapi
  name: OpenAPI 3.x
  conforms: true
  evidence: https://docs.usebruno.com/open-api/openapi-sync
  note: >-
    Imports OpenAPI specs into collections, keeps a collection aligned with a spec via OpenAPI
    Sync (a paid-tier entitlement, 5/month on Pro and unlimited on Ultimate), generates
    collections to OAS, and can drive mock servers from a spec.
- id: graphql
  name: GraphQL
  conforms: true
  evidence: https://docs.usebruno.com/send-requests/graphql/overview
  note: Sends GraphQL queries and mutations with variables and an interactive schema-explorer query builder. Bruno CONSUMES GraphQL; it serves no GraphQL API of its own.
- id: grpc
  name: gRPC / Protocol Buffers
  conforms: true
  evidence: https://docs.usebruno.com/send-requests/grpc/overview
  note: Unary and streaming gRPC requests driven by user-supplied .proto files.
