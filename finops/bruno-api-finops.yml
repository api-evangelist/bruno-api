meters:
- name: paid_seats
  description: Number of licensed users on Pro or Ultimate, billed per user per month (annual commitment).
  unit: users
  aggregation: sum
  dimensions:
  - account
  - plan
- name: openapi_syncs
  description: OpenAPI syncs consumed against plan entitlement (5/mo on Pro, unlimited on Ultimate). A plan entitlement, not a billed meter.
  unit: syncs
  aggregation: sum
  dimensions:
  - account
- name: self_run_compute
  description: Cost of running Bruno locally and the @usebruno/cli in your own CI/CD runners (no Bruno invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Track paid seat counts per team/tier; the open-source client and CLI incur no vendor cost, only workstation/CI compute.
- name: Allocation
  description: Map Pro/Ultimate seats to the teams that need native Git integration, OpenAPI sync, or SSO/SCIM so tooling spend lands on the right cost centers.
- name: Optimization
  description: Keep casual users on the free Open Source tier and reserve paid seats for those needing enterprise features; reclaim unused seats at annual renewal.
- name: Accountability
  description: Assign a license/admin owner; review seat counts and tier fit at renewal against actual feature usage (Git sync, OpenAPI sync, SSO).
