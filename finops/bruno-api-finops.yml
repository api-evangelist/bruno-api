description: >-
  FinOps view of Bruno spend. Bruno is an open-source (MIT) developer tool, not
  a hosted API, so there is no usage-metered API invoice. The open-source client
  and the @usebruno/cli runner are free; cost, when present, is subscription
  (per-seat) spend on the paid Pro and Ultimate tiers or an enterprise support
  agreement, billed annually in USD. Because Bruno is offline-first and runs
  locally, there is no vendor-side compute/egress bill either - the tool runs on
  developer workstations and in your own CI/CD runners.
notes: >-
  This is seat-based tooling spend, not API-call metering. Per-seat rates
  ($6/user/mo Pro, $11/user/mo Ultimate, billed annually) reflect the pricing
  page at review time; verify during reconciliation. The dominant cost driver is
  the number of paid seats.
