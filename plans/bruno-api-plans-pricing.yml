description: >-
  Bruno is an open-source (MIT) API client that is free forever to download and
  use; the company also sells paid Pro and Ultimate subscriptions plus
  enterprise support. Pricing is per user (seat) for the paid tiers, billed
  annually. This is tooling/seat pricing for a developer tool, not API call
  metering - Bruno operates no hosted API. Paid tiers unlock native in-app Git
  integration, OpenAPI sync, external secret managers, report generation, and
  enterprise administration (SSO, SCIM, audit logs, AI governance). The earlier
  one-time "Golden Edition" has been discontinued for new purchases; existing
  Golden Edition licenses remain valid for their holders.
notes: >-
  Re-read from https://www.usebruno.com/pricing on 2026-09-18: the published
  rates ($0 / $6 / $11 per user per month, billed annually) are unchanged from
  the 2026-07-11 capture, and the 14-day Ultimate trial still requires no credit
  card. The feature matrix has moved - AI Assistant, AI Governance, external
  Secret Manager integration, data-driven testing, report generation and
  collection-to-OAS generation are now tiered on the page - so the plan elements
  below were refreshed. Every price on the page is a seat price; there is no
  metered or usage-based line anywhere in Bruno's pricing.
