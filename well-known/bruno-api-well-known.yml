description: 'Well-known document probe across every host this record knows: the registrable domain (usebruno.com),
  www, the documentation host (docs.usebruno.com) and the blog host (blog.usebruno.com). Bruno serves
  real documents only on the documentation host: an A2A agent card, an MCP discovery document, and a markdown
  Agent Skill. No security.txt, openid-configuration, oauth-authorization-server, api-catalog or ai-plugin.json
  is served on any host. api.usebruno.com does not resolve (DNS failure), so Bruno operates no API host.'
