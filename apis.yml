name: Bruno
kind: company
description: >-
  Bruno is an open-source (MIT), git-native API client - a lightweight,
  offline-first alternative to Postman and Insomnia for exploring and testing
  APIs. It is a developer TOOL, not a hosted HTTP API provider. Collections are
  stored on the local filesystem as folders of plain-text files (the .bru "Bru"
  markup language, with OpenCollection YAML now recommended for new
  collections), so API requests are version-controlled in Git alongside code.
  Bruno sends HTTP, REST, GraphQL, and gRPC requests, manages environments and
  variables, and runs pre-request/post-response scripts, tests, and assertions.
  The @usebruno/cli command-line runner (bru) executes collections headlessly in
  CI/CD with JSON, JUnit, and HTML reporters. Bruno is offline-only and does not
  sync request data to a Bruno-hosted cloud; paid Pro/Ultimate tiers add native
  in-app Git integration, OpenAPI sync, and enterprise admin controls that run
  through your own Git provider and identity systems. Bruno does not expose a
  documented public REST HTTP API.
