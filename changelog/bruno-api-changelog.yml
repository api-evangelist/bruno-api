- version: 4.1.0
  date: '2026-08-20'
  breaking: false
  highlights:
  - Rich text documentation editor with syntax-highlighted code blocks.
  - Google Cloud Secret Manager added as an external secret provider.
  - One-click migration of collections from .bru to the OpenCollection YAML format.
  - Default environment per collection; app-level client certificates; Git UI branch selection on pull/push.
  - 'Security hardening: IPC file operations restricted to the collection boundary, and Authorization headers no longer forwarded on cross-origin redirects.'
  - Roughly 50 bug fixes across Postman import/export, OpenAPI import/export, the runner, WebSocket and secret handling.
- version: 4.0.0
  date: '2026-07-23'
  breaking: true
  highlights:
  - 'BYOK AI: bring-your-own-key support for OpenAI-compatible providers, an AI sidebar, AI-assisted docs/scripts/tests, and an AI security tab.'
  - Apps in Bruno - request- and collection-level interactive API experiences.
  - Typed variables (string, number, boolean, object) and separation of secrets from regular environment variables.
  - Secret Manager revamp - configuration moved from secrets.json into environment files, with automatic migration and deprecation guidance for the legacy syntax.
  - Major redesign of Collection Docs with page-based shareable URLs, search and an environment switcher.
  - Akamai EdgeGrid authentication (beta).
  breaking_changes:
  - 'CLI JUnit reporter: the <testcase> classname attribute changed from the request URL to the collection path, breaking Xray/Azure DevOps mappings that keyed on the old format.'
